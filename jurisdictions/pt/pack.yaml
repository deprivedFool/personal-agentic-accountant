calendar:
  - "January-February: check e-fatura invoices and household composition for last year's IRS."
  - "April-June: file IRS (1 April - 30 June); compare joint vs separate filing."
  - "May (plus August/November if split): IMI payments."
  - "Month of car registration: IUC (car tax)."
  - "Before 31 December: PPR contributions to count for this year's deduction."
